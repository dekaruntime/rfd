name: Publish to deka.gg

# The website builds RFDs from this repository — bodies from `main`, and the
# discussion from the issue threads. Without this, changes here are invisible
# until the site's own schedule comes round, which is how a process quietly
# stops being used.
#
# Comment activity matters as much as pushes: most RFDs never become a file,
# so for them the argument IS the content, and a push-only trigger never fires.
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, deleted, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

# A burst of comments on one thread should redeploy the site once, after the
# last of them, not once per comment.
concurrency:
  group: publish-to-deka-gg
  cancel-in-progress: true

jobs:
  notify:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      # deka.gg rebuilds on its own schedule (deploy.yml, cron 17 */2), so this
      # is a latency optimisation rather than a correctness requirement. Same
      # reasoning and the same secret as the headless sync trigger in
      # dekaruntime/deka's release.yml -- CASCADE_DISPATCH_TOKEN is the org's
      # cross-repo dispatch credential. An earlier version of this workflow
      # invented WEBSITE_DISPATCH_TOKEN, which never existed.
      - name: Trigger a deka.gg rebuild
        env:
          GH_TOKEN: ${{ secrets.CASCADE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "CASCADE_DISPATCH_TOKEN not set; skipping cross-repo deka.gg trigger."
            echo "The 2-hourly deploy schedule will pick this up within two hours."
            exit 0
          fi
          # curl, not the gh CLI: gh is not installed on the self-hosted
          # runners, which is why deka's release.yml dropped it too.
          curl -sSL --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dekaruntime/website/dispatches \
            -d "{\"event_type\":\"rfd-updated\",\"client_payload\":{\"event\":\"${{ github.event_name }}\",\"commit\":\"${{ github.sha }}\"}}"
