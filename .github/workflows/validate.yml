name: Validate RFDs

# The issue body and lifecycle label are the canonical RFD record. Validate
# them on repository changes and on every event that can change a live RFD.
on:
  pull_request:
  push:
    branches: [main]
  issues:
    types: [opened, edited, deleted, reopened, closed, labeled, unlabeled]

permissions:
  contents: read
  issues: read

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Canonical issue bodies and lifecycle labels
        run: bun run validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
