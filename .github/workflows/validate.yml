name: Validate RFDs

# Every PR is gated on this. An RFD that cannot parse, is misnumbered, or is
# attributed to an account that does not exist must not reach main — the site
# builds directly from main and fails closed if anything is malformed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Schema, numbering and uniqueness
        run: bun run validate

      # Format is checked offline above; existence needs the network, so it is
      # a separate step. This is what makes an invented contributor impossible
      # rather than merely discouraged.
      #
      # The handles come from the validator, which parses the YAML properly.
      # An earlier version scraped frontmatter with awk and silently found
      # nothing, turning this gate into a no-op that failed for the wrong reason.
      # Asks the public users endpoint directly instead of going through the
      # gh CLI with ${{ github.token }}. That token is an installation token
      # scoped to `contents: read`, which GitHub rejects on endpoints outside
      # the grant -- so this step began failing with "samifouad — no such
      # GitHub account" about an account that plainly exists.
      #
      # The deeper bug was that any failure read as "account does not exist".
      # A check that cannot tell absent from could-not-ask will eventually
      # accuse a real person, which is what happened. 404 now means missing;
      # anything else means the check could not run, and says so.
      - name: Authors resolve to real GitHub accounts
        run: |
          set -euo pipefail
          handles=$(bun run --silent validate --print-authors)
          if [ -z "$handles" ]; then echo "no authors found"; exit 1; fi
          fail=0
          while IFS= read -r h; do
            [ -z "$h" ] && continue
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'accept: application/vnd.github+json' \
              -H 'user-agent: dekaruntime-rfd-validate' \
              "https://api.github.com/users/$h" || echo 000)
            case "$code" in
              200) echo "  ok      $h" ;;
              404) echo "  FAIL    $h — no such GitHub account"; fail=1 ;;
              403|429) echo "  FAIL    $h — rate limited (HTTP $code), could not verify"; fail=1 ;;
              *) echo "  FAIL    $h — could not reach the GitHub API (HTTP $code)"; fail=1 ;;
            esac
          done <<< "$handles"
          exit $fail
